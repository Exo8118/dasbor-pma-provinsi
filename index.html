<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dasbor Distribusi Investasi Asing Menurut Provinsi di Indonesia</title>
<meta name="description" content="Dasbor interaktif realisasi penanaman modal asing (PMA) di 33 provinsi Indonesia, 2010–2024: sebaran, indeks daya tarik, dan dampak kebijakan. Triarka Institute.">
<link rel="alternate" hreflang="id" href="#id"><link rel="alternate" hreflang="en" href="#en">
<style>
:root{
  --navy:#0d2d62; --navy-deep:#071d49; --amber:#ffc107; --amber-deep:#e0a800;
  --bg:#f8f9fb; --card:#ffffff; --text:#222222; --heading:#07162b; --muted:#6b7280;
  --line:#e5e7eb; --tint:#eef3ff; --sea:#f4f6fa; --focus:#0d2d62;
  --c1:#0d2d62; --c2:#e0a800; --c3:#1f8a8a; --c4:#c0392b; --c5:#7fa7d9; --c6:#8a94a6;
  --up:#0d2d62; --down:#b97a00; --sel:#ffc107; --map-stroke:#ffffff; --ok:#1f9d55;
  --radius:16px;
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07162b; --card:#0b2048; --text:#e9eefb; --heading:#ffffff; --muted:#a3b3d1;
    --line:#1d3769; --tint:#12306a; --sea:#050f20; --focus:#ffc107;
    --c1:#7fa6f5; --c2:#ffc107; --c3:#4fc3c3; --c4:#f07070; --c5:#b3c9f2; --c6:#8d9bb5;
    --up:#8fb3ff; --down:#ffc107; --map-stroke:#07162b; --ok:#4cc38a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07162b; --card:#0b2048; --text:#e9eefb; --heading:#ffffff; --muted:#a3b3d1;
  --line:#1d3769; --tint:#12306a; --sea:#050f20; --focus:#ffc107;
  --c1:#7fa6f5; --c2:#ffc107; --c3:#4fc3c3; --c4:#f07070; --c5:#b3c9f2; --c6:#8d9bb5;
  --up:#8fb3ff; --down:#ffc107; --map-stroke:#07162b; --ok:#4cc38a; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1340px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{color:var(--heading);margin:0;letter-spacing:-.5px;line-height:1.2}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.mast{background:var(--navy);color:#fff;padding:28px 0 22px}
.mast .mlogo{display:block;height:48px;width:auto;margin-bottom:14px}
.mast .eyebrow{font-size:12.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--amber)}
.mast h1{color:#fff;font-size:clamp(26px,4.2vw,44px);font-weight:700;letter-spacing:-1px}
.mast p{margin:10px 0 0;max-width:70ch;color:rgba(255,255,255,.82);font-size:16px}
.bar{background:var(--navy-deep);color:#fff;position:relative;z-index:20}
.bar-in{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding-top:12px;padding-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;cursor:pointer}
.tabs button:hover{border-color:#fff}
.tabs button[aria-selected="true"]{background:var(--amber);border-color:var(--amber);color:var(--navy-deep)}
.bar :focus-visible{outline-color:#ffc107}
.field{display:flex;align-items:center;gap:8px;font-size:13.5px;color:rgba(255,255,255,.85)}
.field select{background:#fff;color:#07162b;border:0;border-radius:8px;padding:8px 10px;max-width:280px}
.bar .spacer{flex:1 1 0}
@media (min-width:860px){.bar{position:sticky;top:env(safe-area-inset-top,0px)}}
@media (max-width:700px){.bar .spacer{display:none}.field{flex:1 1 150px;min-width:0}.field select{flex:1 1 0;min-width:0;max-width:none;width:100%}.tabs{width:100%}.tabs button{flex:1 1 auto;padding:9px 10px}.search{min-width:0;width:100%}.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px 13px}.kpi .k-num{font-size:20px}.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}.card{padding:14px}}
@media (max-width:480px){.field{flex:1 1 100%}}

main.wrap{padding-top:22px;padding-bottom:48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.card h2{font-size:18px;font-weight:700}
.sub{color:var(--muted);font-size:13.5px;margin:4px 0 0}
section + section{margin-top:18px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;border-top:4px solid var(--c,var(--line))}
.kpi .k-name{font-weight:700;color:var(--heading);font-size:14.5px}
.kpi .k-num{font-size:clamp(22px,2.3vw,30px);font-weight:700;color:var(--heading);letter-spacing:-.5px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .k-num small{font-size:14px;font-weight:400;color:var(--muted);letter-spacing:0}
.kpi .k-meta{color:var(--muted);font-size:13px;margin-top:2px}
.kpi .k-meta b{color:var(--heading)}
.kpi{display:flex;flex-direction:column}
.kpi .k-name{min-height:2.7em}
.k-gauge{margin:6px auto 0;width:100%;max-width:230px}
.gauge{display:block;width:100%;height:auto;overflow:visible}
.gauge .g-track{fill:none;stroke:var(--tint);stroke-linecap:round}
.gauge .g-val{fill:none;stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:0}
.gauge .g-tick{stroke:var(--muted);stroke-width:1;opacity:.45}
.gauge .g-ref{stroke:var(--heading);stroke-width:2;stroke-dasharray:3 2}
.gauge .g-prev{stroke:var(--muted);stroke-width:3;stroke-linecap:round;opacity:.85}
.gauge .g-nd{fill:var(--heading)}
.gauge .g-hub{fill:var(--card);stroke-width:4}
.gauge .g-end{font-size:11px;fill:var(--muted);font-family:Arial,Helvetica,sans-serif}
.kpi .k-num{text-align:center;margin-top:0}
.kpi .k-meta{text-align:center}
.k-quad{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:10px auto 6px;width:100%;max-width:200px;padding:0 0 16px 16px}
.k-quad .qc{aspect-ratio:1.9;border-radius:8px;background:var(--tint);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.15;color:var(--muted);padding:4px;border:2px solid transparent}
.k-quad .qc.on{background:var(--qc);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(7,22,43,.2)}
.k-quad .qx{position:absolute;left:16px;right:0;bottom:0;text-align:center;font-size:10.5px;color:var(--muted)}
.k-quad .qy{position:absolute;left:-26px;top:42%;transform:rotate(-90deg);font-size:10.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
 .gauge .g-val{animation:gsweep .9s cubic-bezier(.2,.8,.2,1) both}
 .gauge .g-needle{animation:gneedle .9s cubic-bezier(.2,.8,.2,1) both}
 @keyframes gsweep{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
 @keyframes gneedle{from{transform:rotate(0deg)}to{transform:rotate(var(--a))}}
}

/* highlight story card */
.hl{padding:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.9fr)}
.hl-head{position:relative;background:linear-gradient(150deg,#0d2d62 0%,#071d49 70%);color:#fff;padding:22px 22px 16px;overflow:hidden;isolation:isolate}
.hl-head::before{content:"";position:absolute;width:340px;height:340px;right:-140px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(255,193,7,.32),rgba(255,193,7,0) 70%);z-index:-1}
.hl-kick{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#071d49;background:#ffc107;border-radius:999px;padding:2px 10px}
.hl-head h2{color:#fff;font-size:clamp(20px,2vw,26px);line-height:1.15;margin-top:10px}
.hl-head p{margin:8px 0 0;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.82);max-width:42ch}
.hl-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:16px;font-variant-numeric:tabular-nums}
.hl-from{font-size:20px;font-weight:700;color:rgba(255,255,255,.6)}
.hl-arrow{font-size:20px;color:#ffc107}
.hl-to{font-size:clamp(30px,3vw,40px);font-weight:700;color:#ffc107;letter-spacing:-1px}
.hl-to small{font-size:15px;color:rgba(255,255,255,.8);letter-spacing:0;font-weight:400}
.hl-cap{font-size:12.5px;color:rgba(255,255,255,.7)}
.hl-spark{display:block;width:100%;max-width:440px;height:auto;margin-top:10px}
.hl-spark .hl-ev{font-size:10px;fill:rgba(255,255,255,.75);font-family:Arial,Helvetica,sans-serif}
.hl-spark .hl-ax{font-size:10px;fill:rgba(255,255,255,.6);font-family:Arial,Helvetica,sans-serif}
.hl-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.hl-tile{padding:18px 20px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.hl-tile.wide{grid-column:1 / -1;border-bottom:0}
.hl-tt{font-weight:700;color:var(--heading);font-size:14.5px}
.hl-num{font-size:clamp(26px,2.4vw,34px);font-weight:700;color:var(--heading);letter-spacing:-.8px;font-variant-numeric:tabular-nums;line-height:1.1}
.hl-num.up{color:var(--up)}
.hl-sub{font-size:12.5px;color:var(--muted)}
.hl-note{font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:6px;line-height:1.4}
.hl-bars{display:grid;gap:6px;margin-top:6px}
.hb{display:grid;grid-template-columns:76px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hb-t{height:12px;border-radius:6px;background:var(--tint);overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:6px;background:var(--c5)}
.hb.on .hb-t i{background:linear-gradient(90deg,var(--c2),#ffb300)}
.hb.on{color:var(--heading);font-weight:700}
.hb-v{text-align:right}
.hl-mult{display:grid;gap:8px;margin-top:8px}
.hm-row{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.hm-row b{color:var(--heading);text-align:right;font-variant-numeric:tabular-nums}
.hm-bar{height:12px;border-radius:6px;background:var(--tint);overflow:hidden}
.hm-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--c1),var(--c5))}
.hm-bar i.t{background:var(--c6)}
.hl-fbox{width:100%;min-width:0;margin-top:6px}
.hl-forest{display:block;max-width:100%}
.hl-forest .hf-grid{stroke:var(--line)}
.hl-forest .hf-l{font-size:12.5px;font-weight:700;fill:var(--heading);font-family:Arial,Helvetica,sans-serif}
.hl-forest .hf-v{font-size:12.5px;font-weight:700;fill:var(--muted);font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}
.hl-forest .hf-a{font-size:10.5px;fill:var(--muted);font-family:Arial,Helvetica,sans-serif}
.hl-forest .hf-zero{stroke:var(--muted);stroke-dasharray:3 3}
@media (prefers-reduced-motion:no-preference){.hb-t i,.hm-bar i{animation:hlgrow .8s cubic-bezier(.2,.8,.2,1) both}@keyframes hlgrow{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}}
@media (max-width:1020px){.hl{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.hl-tiles{grid-template-columns:minmax(0,1fr)}.hl-tile{border-left:0}}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1020px){.stage{grid-template-columns:minmax(0,1fr)}}
.side,.maincol{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;min-width:0}
.maphead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;justify-content:space-between}
.scope{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.btn{border:1px solid var(--navy);background:transparent;color:var(--navy);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px}
.btn:hover{background:var(--navy);color:#fff}
:root[data-theme="dark"] .btn{border-color:var(--amber);color:var(--amber)}
:root[data-theme="dark"] .btn:hover{background:var(--amber);color:#071d49}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{border-color:var(--amber);color:var(--amber)} :root:not([data-theme="light"]) .btn:hover{background:var(--amber);color:#071d49}}
.mapbox{position:relative;margin-top:12px;border-radius:12px;background:var(--sea);border:1px solid var(--line);overflow:hidden}
#map{display:block;width:100%;touch-action:pan-y;cursor:grab}
#map:active{cursor:grabbing}
#map path.pv{stroke:var(--map-stroke);stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer}
#map path.pv.dim{opacity:.22}
#map path.selo{fill:none;stroke:var(--sel);stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
#map path.selo2{fill:none;stroke:#071d49;stroke-width:5;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
#map text.lbl{font-size:10.5px;fill:var(--heading);paint-order:stroke;stroke:var(--card);stroke-width:3px;pointer-events:none;font-weight:700}
.zoomer{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoomer button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:17px;line-height:1}
.hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:var(--card);border-radius:6px;padding:2px 8px;opacity:.9}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;min-width:200px;max-width:270px;box-shadow:0 6px 18px rgba(7,22,43,.18);z-index:5;display:none}
.tip b{color:var(--heading)}
.tip .t-row{display:flex;justify-content:space-between;gap:14px}
.tip .t-row span:last-child{font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12.5px;color:var(--muted);align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend .sw{display:inline-block;width:16px;height:12px;border-radius:3px;border:1px solid rgba(127,127,127,.35)}
.legend b{color:var(--heading);font-weight:700}
.legend .lg-note{flex-basis:100%;white-space:normal}

/* detail */
.detail .empty{color:var(--muted);margin:8px 0 0}
.d-head{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:flex-start}
.d-prov{color:var(--muted);font-size:13.5px}
.d-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 24px;align-items:start}
.d-block{margin-top:14px}
.d-title{font-weight:700;color:var(--heading);font-size:13.5px;display:flex;justify-content:space-between;gap:10px}
.d-title span{font-weight:400;color:var(--muted)}
.d-list{margin:6px 0 0;padding:0;list-style:none;font-size:13px}
.d-list li{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px dashed var(--line)}
.d-list li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700;color:var(--heading)}
.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;margin-top:6px;background:var(--tint)}
.stack i{display:block;height:100%}
.flag{display:inline-block;font-size:11.5px;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:0 8px;margin-left:6px;white-space:nowrap;vertical-align:middle}
.flag.warn{border-color:var(--amber-deep);color:var(--heading);background:rgba(255,193,7,.18)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap;color:var(--heading)}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
svg.ch{display:block;width:100%;margin-top:8px}
svg.ch text{font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:var(--muted)}
svg.ch .grid{stroke:var(--line)} svg.ch .ref{stroke:var(--muted);stroke-dasharray:4 3}
.chartbox{position:relative}

/* provinces lists */
.provgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:1020px){.provgrid{grid-template-columns:minmax(0,1fr)}}
.plist{margin-top:12px;display:grid;gap:2px}
.prow{display:grid;grid-template-columns:170px minmax(0,1fr) 70px;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:5px 8px;cursor:pointer}
.prow:hover{background:var(--tint)}
.prow[aria-pressed="true"]{background:var(--tint);box-shadow:inset 3px 0 0 var(--amber)}
.prow .pn{font-weight:700;color:var(--heading);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pt{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar{display:block;height:14px}
.pbar span{display:flex;height:100%;border-radius:3px;overflow:hidden;min-width:2px}
.pbar i{display:block;height:100%}
.track{position:relative;display:block;height:14px}
.track::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--line)}
.track .seg{position:absolute;top:5px;height:4px;border-radius:2px}
.track .d0,.track .d1{position:absolute;top:2px;width:10px;height:10px;border-radius:50%;margin-left:-5px}
.track .d0{background:var(--card);border:2px solid var(--muted)}
.track .d1{background:var(--c1)}
@media (max-width:760px){.prow{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}.prow .pbar,.prow .track{grid-column:1 / -1;grid-row:2}}

/* research */
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:1020px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.mlegend span{display:inline-flex;align-items:center;gap:6px}
.mlegend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.verdict{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.v-pos{background:rgba(13,45,98,.12);color:var(--heading)}
.v-weak{background:rgba(255,193,7,.22);color:var(--heading)}
.v-none{background:var(--tint);color:var(--muted)}
.v-neg{background:rgba(192,57,43,.15);color:var(--heading)}

/* table */
.thead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.search{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;min-width:240px;max-width:100%}
.tscroll{margin-top:12px;overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:right;padding:0;white-space:nowrap;z-index:2}
thead th:first-child,thead th.l{text-align:left}
thead th button{all:unset;display:block;width:100%;box-sizing:border-box;padding:10px 12px;cursor:pointer;font-weight:700}
thead th button:focus-visible{outline:3px solid #ffc107;outline-offset:-3px}
thead th[aria-sort] button{color:#ffc107}
thead th.plain{padding:10px 12px;font-weight:700}
tbody td{padding:7px 12px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td:first-child,tbody td.l{text-align:left}
tbody tr:hover{background:var(--tint)}
tbody tr.on{background:var(--tint);box-shadow:inset 3px 0 0 var(--amber)}
td .nm{all:unset;cursor:pointer;font-weight:700;color:var(--heading)}
td .nm:hover{text-decoration:underline}
td .nm:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
td .wd{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
td.wrapc{white-space:normal;min-width:150px}
#ptbl td.l{white-space:normal}
#ptbl td,#ptbl th.plain{padding-left:8px;padding-right:8px}
.up{color:var(--up);font-weight:700} .down{color:var(--down);font-weight:700}
.count{color:var(--muted);font-size:13px}

/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 32px;margin-top:10px}
.notes h3{font-size:15px;margin:10px 0 6px}
.notes p,.notes li{font-size:13.5px;max-width:70ch}
.notes ul{margin:0;padding-left:18px}
.notes li+li{margin-top:6px}
.credit{margin-top:14px;font-size:12.5px;color:var(--muted)}
a{color:var(--navy)} :root[data-theme="dark"] a{color:#9fbcff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:#9fbcff}}
@media (prefers-reduced-motion:no-preference){.kpi .k-bar i,.pbar span{transition:width .25s ease}}

/* language switch */
.mast .wrap{position:relative}
.lang{position:absolute;top:0;right:max(20px,env(safe-area-inset-right,0px));display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px;gap:2px;background:rgba(7,29,73,.35)}
.lang button{border:0;background:transparent;color:#fff;font-weight:700;font-size:13px;letter-spacing:.5px;padding:6px 13px;border-radius:999px;cursor:pointer}
.lang button:hover{background:rgba(255,255,255,.12)}
.lang button[aria-pressed="true"]{background:var(--amber);color:var(--navy-deep)}
.lang button:focus-visible{outline:3px solid #ffc107;outline-offset:2px}
@media (max-width:700px){.lang{right:max(14px,env(safe-area-inset-right,0px))}}
</style>
</head>

      <p class="sub">Koefisien terhadap ln realisasi PMA, 33 provinsi, 2012–2024 (n = 429), regresor dengan lag satu tahun. Tiap baris memakai skalanya sendiri dengan nol di tengah; garis yang melewati nol berarti tidak signifikan. Model utama adalah efek tetap dua arah (provinsi dan tahun).</p>

  <section class="card">
    <h2>Sumber data dan cara membaca</h2>
    <div class="notes">
      <div>
        <h3>Sumber</h3>
        <ul>
          <li><b>Realisasi PMA dan PMDN:</b> mikrodata Laporan Kegiatan Penanaman Modal (LKPM) triwulanan BKPM/Kementerian Investasi dan Hilirisasi, triwulan I 2010–triwulan IV 2024 (539.851 catatan, data.bkpm.go.id). Totalnya sama dengan angka nasional yang dipublikasikan BKPM.</li>
          <li><b>PDRB riil dan ekspor neto:</b> BPS, PDRB atas dasar harga konstan 2010 menurut pengeluaran. <b>Buta aksara:</b> BPS, Susenas (penduduk 15+). <b>Panjang jalan:</b> BPS, 2021–2022.</li>
          <li><b>Penduduk:</b> OECD Regional Database, diinterpolasi antara Sensus 2010 dan 2020. <b>Upah minimum:</b> BPS, Kemnaker dan keputusan gubernur. <b>IPM:</b> BPS. <b>Konflik:</b> UCDP-GED 26.1.</li>
          <li><b>Estimasi:</b> Triarka Institute, Laporan Penelitian No. 2026-04, <i>Beyond Java? Location Determinants and Provincial Attractiveness of Foreign Direct Investment in Indonesia: A Panel Data Study</i>.</li>
          <li><b>Batas wilayah:</b> peta dasar BIG/Bakosurtanal 1:250.000, disederhanakan untuk tampilan.</li>
        </ul>
      </div>
      <div>
        <h3>Cara membaca indeks</h3>
        <p><b>Indeks daya tarik</b> adalah rata-rata sembilan skor 0–1: ukuran pasar, daya beli, pertumbuhan tiga tahun, produktivitas yang disesuaikan dengan biaya (kebalikan upah efisiensi), stok PMA, IPM, melek aksara, keamanan, dan PMDN. Setiap komponen di-<i>winsorize</i> pada persentil ke-5 dan ke-95 per tahun.</p>
        <p><b>Indeks kinerja</b> adalah pangsa provinsi dalam PMA nasional dibagi pangsanya dalam PDRB nasional. Nilai di atas 1 berarti provinsi menerima PMA lebih besar daripada ukuran ekonominya.</p>
        <p><b>Kelompok potensi–kinerja</b> (UNCTAD) memakai median indeks daya tarik dan indeks kinerja 1 sebagai garis pemisah. Kelompok dihitung untuk 2020–2024.</p>
      </div>
      <div>
        <h3>Batasan yang perlu diketahui</h3>
        <ul>
          <li>Realisasi PMA LKPM mencatat lokasi proyek dan bukan ukuran neraca pembayaran Bank Indonesia; laba yang ditanamkan kembali dan pinjaman antarperusahaan tidak termasuk.</li>
          <li>Provinsi memakai batas wilayah 2010: Kalimantan Utara digabung ke Kalimantan Timur, dan provinsi-provinsi Papua pasca-2022 digabung ke Papua dan Papua Barat.</li>
          <li>Indeks daya tarik dihitung mulai 2011 karena komponen pertumbuhan memerlukan data tiga tahun; periode pertama indeks adalah 2011–2014.</li>
          <li>Efek kebijakan yang hanya berlaku di satu sampai tiga provinsi (nikel, IKN) tidak presisi dan perlu dibaca bersama nilai p bootstrap.</li>
          <li>Ekspor neto provinsi mencakup perdagangan luar negeri dan antardaerah.</li>
        </ul>
      </div>
    </div>
    <p class="credit">Dasbor ini disusun oleh Triarka Institute. Angka dapat dikutip dengan menyebut sumber: Triarka Institute (2026), Laporan Penelitian No. 2026-04.</p>

  <section class="card">
    <h2>Data sources and how to read</h2>
    <div class="notes">
      <div>
        <h3>Sources</h3>
        <ul>
          <li><b>Realised FDI and domestic investment:</b> quarterly investment-activity report (LKPM) microdata from BKPM/Ministry of Investment and Downstreaming, 2010Q1–2024Q4 (539,851 records, data.bkpm.go.id). Totals match BKPM’s published national figures.</li>
          <li><b>Real GRDP and net exports:</b> BPS, GRDP at constant 2010 prices by expenditure. <b>Illiteracy:</b> BPS, Susenas (population 15+). <b>Road length:</b> BPS, 2021–2022.</li>
          <li><b>Population:</b> OECD Regional Database, interpolated between the 2010 and 2020 censuses. <b>Minimum wages:</b> BPS, Ministry of Manpower and governors’ decrees. <b>HDI:</b> BPS. <b>Conflict:</b> UCDP-GED 26.1.</li>
          <li><b>Estimates:</b> Triarka Institute, Research Report No. 2026-04, <i>Beyond Java? Location Determinants and Provincial Attractiveness of Foreign Direct Investment in Indonesia: A Panel Data Study</i>.</li>
          <li><b>Boundaries:</b> BIG/Bakosurtanal 1:250,000 base map, simplified for display.</li>
        </ul>
      </div>
      <div>
        <h3>How to read the indices</h3>
        <p>The <b>attractiveness index</b> is the average of nine 0–1 scores: market size, purchasing power, three-year growth, cost-adjusted productivity (the inverse of the efficiency wage), FDI stock, HDI, literacy, security and domestic investment. Each component is winsorised at the 5th and 95th percentiles within each year.</p>
        <p>The <b>performance index</b> is a province’s share of national FDI divided by its share of national GRDP. Above 1 means the province receives more FDI than its economic size would suggest.</p>
        <p>The <b>potential–performance groups</b> (UNCTAD) use the median attractiveness index and a performance index of 1 as dividing lines. Groups are computed for 2020–2024.</p>
      </div>
      <div>
        <h3>Limitations</h3>
        <ul>
          <li>LKPM realised FDI records project location and is not Bank Indonesia’s balance-of-payments measure; reinvested earnings and intra-company loans are excluded.</li>
          <li>Provinces are at their 2010 boundaries: North Kalimantan is merged into East Kalimantan, and the post-2022 Papuan provinces into Papua and West Papua.</li>
          <li>The attractiveness index starts in 2011 because the growth component needs three years of data; its first period is 2011–2014.</li>
          <li>Effects of policies that cover only one to three provinces (nickel, IKN) are imprecise and should be read with the bootstrap p-values.</li>
          <li>Provincial net exports include both foreign and inter-regional trade.</li>
        </ul>
      </div>
    </div>
    <p class="credit">This dashboard was prepared by Triarka Institute. Figures may be cited as: Triarka Institute (2026), Research Report No. 2026-04.</p>

function buildMap(){
  const box=$('#mapbox');W=box.clientWidth;H=Math.round(Math.max(W<520?210:260,Math.min(540,W*0.42)));

/* ---------- meter (gauge) ---------- */
let gid=0;
function gauge(o){
  /* o: {c,v,min,max,prev,log,zones:[[from,to,color]],marks:[[val,label]],lo,hi,valTxt,unit} */
  const W=220,H=132,cx=110,cy=112,r=86,sw=16;
  const sc=x=>{if(x==null||!isFinite(x))return 0;const t=o.log?(Math.log(Math.max(x,o.min))-Math.log(o.min))/(Math.log(o.max)-Math.log(o.min)):(x-o.min)/(o.max-o.min);return Math.max(0,Math.min(1,t));};
  const pt=(t,rr=r)=>[cx-rr*Math.cos(Math.PI*t),cy-rr*Math.sin(Math.PI*t)];
  const arc=(t0,t1,rr=r)=>{const a=pt(t0,rr),b=pt(t1,rr);return `M${a[0].toFixed(2)},${a[1].toFixed(2)}A${rr},${rr} 0 0 1 ${b[0].toFixed(2)},${b[1].toFixed(2)}`;};
  const t=sc(o.v),id='g'+(++gid);
  let s=`<svg class="gauge" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'')}">`;
  s+=`<path d="${arc(0,1)}" class="g-track" stroke-width="${sw}"/>`;
  (o.zones||[]).forEach(z=>{s+=`<path d="${arc(sc(z[0]),sc(z[1]),r+sw/2+5)}" stroke="${z[2]}" stroke-width="4" fill="none" stroke-linecap="butt"/>`;});
  if(t>0.001)s+=`<path d="${arc(0,t)}" class="g-val" stroke="${o.c}" stroke-width="${sw}" pathLength="100"/>`;
  for(let i=0;i<=10;i++){const a=pt(i/10,r-sw/2-3),b=pt(i/10,r-sw/2-(i%5?7:11));s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" class="g-tick"/>`;}
  (o.marks||[]).forEach(m=>{const tt=sc(m[0]),a=pt(tt,r+sw/2+2),b=pt(tt,r-sw/2-2);s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" class="g-ref"/>`;});
  if(o.prev!=null&&isFinite(o.prev)){const tp=sc(o.prev),a=pt(tp,r+sw/2+3),b=pt(tp,r-sw/2-3);s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" class="g-prev"/>`;}
  const deg=180*t;
  s+=`<g class="g-needle" style="--a:${deg}deg;transform-origin:${cx}px ${cy}px;transform:rotate(${deg}deg)"><path d="M${cx-r+sw+6},${cy}L${cx},${cy-4.5}L${cx},${cy+4.5}Z" class="g-nd"/></g><circle cx="${cx}" cy="${cy}" r="8" class="g-hub" stroke="${o.c}"/>`;
  s+=`<text x="${cx-r}" y="${H-2}" text-anchor="middle" class="g-end">${o.lo}</text><text x="${cx+r}" y="${H-2}" text-anchor="middle" class="g-end">${o.hi}</text>`;
  return s+'</svg>';
}
function kpi(o){

}

   div:['#9a6b00','#f5c21a','#ffe9a3','#eef0f4','#bccdf0','#557bc4','#0d2d62'],quad:{'Front-runner':'#0d2d62','Above potential':'#e0a800','Below potential':'#8aa5dd','Under-performer':'#d5dae3'}},

 {k:'fdi',l:'Realised FDI (US$ million)',val:p=>p.p[S.per].fdi,th:[500,1000,2500,5000,10000],pal:'seq',fmt:x=>f0(x),unit:''},
 {k:'chg',l:'Change in share from previous period (points)',val:p=>{const q=prevPer();return q?p.p[S.per].sh-p.p[q].sh:null;},th:[-5,-2,-0.5,0.5,2,5],pal:'div',fmt:fpp,unit:' points'},
 {k:'met',l:'Basic metals in provincial FDI (%)',val:p=>p.p[S.per].fdi?p.p[S.per].met/p.p[S.per].fdi*100:0,th:[1,5,15,30,50],pal:'amb',fmt:x=>dec(x,0)+'%',unit:'%'},
 {k:'idx',l:'Attractiveness index (0–1)',val:p=>p.p[S.per].idx,th:[0.3,0.4,0.5,0.6,0.7],pal:'seq',fmt:x=>dec(x,2),unit:''},
 {k:'perf',l:'FDI performance index',val:p=>p.p[S.per].perf,th:[0.25,0.5,1,2,5],pal:'seq',fmt:x=>dec(x,2),unit:''},
 {k:'quad',l:'Potential–performance group (2020–2024)',val:p=>p.q,pal:'quad'},
 {k:'road',l:'Road density 2021–22 (km per 100 km²)',val:p=>p.road,th:[25,50,75,100,200],pal:'seq',fmt:x=>f0(x),unit:''}

function fillFor(p){
  const P=PAL[theme()],m=mode(),v=m.val(p);

function legend(){
  const P=PAL[theme()],m=mode(),sw=(c,l)=>`<span class="lg"><i class="sw" style="background:${c}"></i>${l}</span>`;
  let h=`<span class="lg"><b>${m.l}${m.k==='quad'?'':', '+PERL[S.per]}</b></span>`;
  if(m.pal==='quad')h+=QL.map(q=>sw(P.quad[q],q)).join('');
  else if(m.pal==='div'){const t=m.th;const lab=[`down more than ${dec(-t[0],0)} points`,`down ${dec(-t[1],0)}–${dec(-t[0],0)}`,`down ${dec(-t[2],1)}–${dec(-t[1],0)}`,`stable (±${dec(t[3],1)})`,`up ${dec(t[3],1)}–${dec(t[4],0)}`,`up ${dec(t[4],0)}–${dec(t[5],0)}`,`up more than ${dec(t[5],0)} points`];h+=P.div.map((c,i)=>sw(c,lab[i])).join('');}
  else{const pal=P[m.pal],t=m.th;h+=pal.map((c,i)=>sw(c,i===0?`below ${m.fmt(t[0])}`:i===t.length?`${m.fmt(t[i-1])} and above`:`${m.fmt(t[i-1])}–${m.fmt(t[i])}`)).join('');}
  if(m.k==='chg'&&!prevPer())h+=`<span class="lg lg-note">2010–2014 has no earlier period to compare with; choose another period.</span>`;
  if(m.k==='quad')h+=`<span class="lg lg-note">Dividing lines: median attractiveness index (${dec(D.med,2)}) and a performance index of 1. Groups are always computed for 2020–2024.</span>`;
  if(m.k==='road')h+=`<span class="lg lg-note">BPS road length is complete only for 2021–2022, so colours do not change between periods.</span>`;

/* ---------- map ---------- */
const geo=JSON.parse(document.getElementById('geo').textContent);
const feats=geo.features;
const svg=d3.select('#map');let gRoot,pvSel,path,zoom,W=0,H=0,selA,selB,lblSel;
function buildMap(){
  const box=$('#mapbox');W=box.clientWidth;H=Math.round(Math.max(W<520?210:260,Math.min(540,W*0.42)));
  svg.attr('viewBox',`0 0 ${W} ${H}`).attr('height',H).selectAll('*').remove();
  const proj=d3.geoMercator().fitExtent([[10,10],[W-10,H-10]],geo);
  path=d3.geoPath(proj);
  gRoot=svg.append('g');
  pvSel=gRoot.append('g').selectAll('path').data(feats).join('path').attr('class','pv').attr('d',path)
    .on('click',(e,d)=>select(d.properties.pid))
    .on('pointermove',(e,d)=>{if(e.pointerType==='mouse')showTip(e,d.properties.pid);})
    .on('pointerleave',()=>{$('#tip').style.display='none';});
  selB=gRoot.append('path').attr('class','selo2');selA=gRoot.append('path').attr('class','selo');
  lblSel=gRoot.append('g').selectAll('text').data(feats).join('text').attr('class','lbl').attr('text-anchor','middle')
    .attr('transform',d=>{const c=path.centroid(d);return `translate(${c[0]},${c[1]})`;}).text('');
  zoom=d3.zoom().scaleExtent([1,12]).translateExtent([[0,0],[W,H]])
    .filter(e=>{if(e.type==='wheel')return e.ctrlKey||e.metaKey;if(e.type==='touchstart')return e.touches.length>1;return !e.button;})
    .on('zoom',e=>{gRoot.attr('transform',e.transform);lblSel.style('font-size',(10.5/e.transform.k)+'px').style('stroke-width',3/e.transform.k+'px');});
  svg.call(zoom);
  paintMap();zoomToScope(false);
}
function paintMap(){
  pvSel.attr('fill',d=>fillFor(byId.get(d.properties.pid))).classed('dim',d=>!!S.prov&&d.properties.pid!==S.prov);
  const f=S.sel?feats.find(f=>f.properties.pid===S.sel):null,dd=f?path(f):null;
  selA.attr('d',dd);selB.attr('d',dd);
  lblSel.text(d=>(S.prov&&d.properties.pid===S.prov)?byId.get(d.properties.pid).n:'');
}
const still=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function zoomToScope(anim=true){
  let t=d3.zoomIdentity;
  if(S.prov){
    const f=feats.find(f=>f.properties.pid===S.prov),b=path.bounds(f);
    const k=Math.min(8,0.8/Math.max((b[1][0]-b[0][0])/W,(b[1][1]-b[0][1])/H));
    t=d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-(b[0][0]+b[1][0])/2,-(b[0][1]+b[1][1])/2);
  }
  (anim&&!still()?svg.transition().duration(450):svg).call(zoom.transform,t);
}
function tipHTML(p){
  const x=p.p[S.per],row=(a,b)=>`<div class="t-row"><span>${a}</span><span>${b}</span></div>`;
  let h=`<b>${esc(p.n)}</b><div style="color:var(--muted)">${esc(p.c)} · ${PERL[S.per]}</div>`;
  h+=row('Realised FDI',`US$${f0(x.fdi)} million`)+row('National share',dec(x.sh,1)+'%')+row('Basic metals share',x.fdi?dec(x.met/x.fdi*100,0)+'%':'–');
  h+='<div style="border-top:1px solid var(--line);margin:5px 0 4px"></div>';
  h+=row(`Attractiveness index (${IDXL[S.per]})`,dec(x.idx,2))+row('Rank',`${x.rk} of 33`)+row('Performance index',dec(x.perf,2));
  if(S.mode==='road')h+=row('Road density',f0(p.road)+' km/100 km²');
  return h;
}
function showTip(e,pid){
  const tip=$('#tip'),box=$('#mapbox').getBoundingClientRect();
  tip.innerHTML=tipHTML(byId.get(pid));tip.style.display='block';
  let x=e.clientX-box.left+14,y=e.clientY-box.top+14;
  if(x+tip.offsetWidth>box.width-6)x=e.clientX-box.left-tip.offsetWidth-14;
  if(y+tip.offsetHeight>box.height-6)y=Math.max(4,e.clientY-box.top-tip.offsetHeight-14);
  tip.style.left=Math.max(4,x)+'px';tip.style.top=y+'px';
}

/* ---------- aggregates ---------- */
function natPeriod(per){
  const [a,b]=YR[per],ys=D.years.filter(y=>y>=a&&y<=b);
  const sum=k=>ys.reduce((t,y)=>t+D.nat[k][yi(y)],0);
  const tot=sum('fdi'),java=sum('java'),met=sum('met');
  const east=prov.filter(p=>p.c==='Sulawesi'||p.c==='Maluku–Papua').reduce((t,p)=>t+p.p[per].fdi,0);
  const nick=prov.filter(p=>NICKEL.includes(p.pid)).reduce((t,p)=>t+p.p[per].fdi,0);
  const hhi=prov.reduce((t,p)=>t+Math.pow(p.p[per].sh,2),0);
  return{tot,java:java/tot*100,east:east/tot*100,met:met/tot*100,hhi,nick:nick/tot*100,ys};
}

/* ---------- KPIs ---------- */
/* ---------- meter (gauge) ---------- */
let gid=0;
function gauge(o){
  /* o: {c,v,min,max,prev,log,zones:[[from,to,color]],marks:[[val,label]],lo,hi,valTxt,unit} */
  const W=220,H=132,cx=110,cy=112,r=86,sw=16;
  const sc=x=>{if(x==null||!isFinite(x))return 0;const t=o.log?(Math.log(Math.max(x,o.min))-Math.log(o.min))/(Math.log(o.max)-Math.log(o.min)):(x-o.min)/(o.max-o.min);return Math.max(0,Math.min(1,t));};
  const pt=(t,rr=r)=>[cx-rr*Math.cos(Math.PI*t),cy-rr*Math.sin(Math.PI*t)];
  const arc=(t0,t1,rr=r)=>{const a=pt(t0,rr),b=pt(t1,rr);return `M${a[0].toFixed(2)},${a[1].toFixed(2)}A${rr},${rr} 0 0 1 ${b[0].toFixed(2)},${b[1].toFixed(2)}`;};
  const t=sc(o.v),id='g'+(++gid);
  let s=`<svg class="gauge" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'')}">`;
  s+=`<path d="${arc(0,1)}" class="g-track" stroke-width="${sw}"/>`;
  (o.zones||[]).forEach(z=>{s+=`<path d="${arc(sc(z[0]),sc(z[1]),r+sw/2+5)}" stroke="${z[2]}" stroke-width="4" fill="none" stroke-linecap="butt"/>`;});
  if(t>0.001)s+=`<path d="${arc(0,t)}" class="g-val" stroke="${o.c}" stroke-width="${sw}" pathLength="100"/>`;
  for(let i=0;i<=10;i++){const a=pt(i/10,r-sw/2-3),b=pt(i/10,r-sw/2-(i%5?7:11));s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" class="g-tick"/>`;}
  (o.marks||[]).forEach(m=>{const tt=sc(m[0]),a=pt(tt,r+sw/2+2),b=pt(tt,r-sw/2-2);s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" class="g-ref"/>`;});
  if(o.prev!=null&&isFinite(o.prev)){const tp=sc(o.prev),a=pt(tp,r+sw/2+3),b=pt(tp,r-sw/2-3);s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" class="g-prev"/>`;}
  const deg=180*t;
  s+=`<g class="g-needle" style="--a:${deg}deg;transform-origin:${cx}px ${cy}px;transform:rotate(${deg}deg)"><path d="M${cx-r+sw+6},${cy}L${cx},${cy-4.5}L${cx},${cy+4.5}Z" class="g-nd"/></g><circle cx="${cx}" cy="${cy}" r="8" class="g-hub" stroke="${o.c}"/>`;
  s+=`<text x="${cx-r}" y="${H-2}" text-anchor="middle" class="g-end">${o.lo}</text><text x="${cx+r}" y="${H-2}" text-anchor="middle" class="g-end">${o.hi}</text>`;
  return s+'</svg>';
}
function kpi(o){
  return `<div class="kpi" style="--c:${o.c}"><div class="k-name">${o.name}</div><div class="k-gauge">${gauge(o)}</div><div class="k-num">${o.num}</div><div class="k-meta">${o.meta}</div></div>`;
}

      num:`US$${dec(n.tot/1000,1)} <small>billion</small>`,meta:`${PERL[per]}; average US$${dec(n.tot/1000/n.ys.length,1)} billion a year${o?`, <b class="${n.tot>=o.tot?'up':'down'}">${fsg((n.tot/o.tot-1)*100,0)}%</b> from ${PERL[pp]}`:''}`,aria:'Realised FDI gauge'});

    h+=kpi({c:'var(--c2)',name:'Sulawesi and Maluku–Papua share',v:n.east,prev:o&&o.east,min:0,max:50,lo:'0%',hi:'50%',num:`${dec(n.east,1)}%`,meta:cmp(n.east,o&&o.east),aria:'Eastern share gauge'});
    h+=kpi({c:'var(--c4)',name:'Basic metals share',v:n.met,prev:o&&o.met,min:0,max:50,lo:'0%',hi:'50%',num:`${dec(n.met,1)}%`,meta:o?`${cmp(n.met,o.met)}; mainly nickel processing`:'mainly nickel processing',aria:'Basic metals gauge'});
    h+=kpi({c:'var(--c3)',name:'Provincial concentration (HHI)',v:n.hhi,prev:o&&o.hhi,min:0,max:3000,lo:'0',hi:'3,000',zones:zoneHHI,num:f0(n.hhi),meta:`${o?`${f0(o.hhi)} in ${PERL[pp]}; `:''}green: below 1,500, unconcentrated`,aria:'HHI gauge'});

      num:`US$${f0(x.fdi)} <small>million</small>`,meta:`${PERL[per]}${o?`; <b class="${x.fdi>=o.fdi?'up':'down'}">${fsg((x.fdi/Math.max(o.fdi,0.1)-1)*100,0)}%</b> from ${PERL[pp]}`:''}; log scale`,aria:'Provincial FDI gauge'});
    h+=kpi({c:CC[p.c],name:'Share of national FDI',v:x.sh,prev:o&&o.sh,min:0,max:Math.ceil(mxS/5)*5,lo:'0%',hi:f0(Math.ceil(mxS/5)*5)+'%',marks:[[x.gsh,'']],num:`${dec(x.sh,2)}%`,meta:`dashed line: GRDP share ${dec(x.gsh,2)}%${o?`; ${PERL[pp]}: ${dec(o.sh,2)}%`:''}`,aria:'FDI share gauge'});

    const qi=QL.indexOf(p.q),qc=P.quad;

    <div class="hl-mult"><div class="hm-row"><span>${T.metals}</span><span class="hm-bar"><i style="width:100%"></i></span><b>×${f0(Math.exp(hm.b))}</b></div><div class="hm-row"><span>${T.total}</span><span class="hm-bar"><i class="t" style="width:${Math.max(3,(Math.exp(ht.b))/Math.exp(hm.b)*100)}%"></i></span><b>+${dec((Math.exp(ht.b)-1)*100,0)}%</b></div></div><div class="hl-note">${T.n2}</div></div>`;

/* ---------- research ---------- */
const MOD=['Two-way FE','One-way FE','Random effects'],MC={'Two-way FE':'var(--c1)','One-way FE':'var(--c3)','Random effects':'var(--c2)'};
function renderCoef(){
  $('#coefLegend').innerHTML=MOD.map(m=>`<span><i style="background:${MC[m]}"></i>${m}${m==='Two-way FE'?' (preferred)':''}</span>`).join('');
  const el=$('#coef'),w=el.clientWidth||520,dets=[...new Set(D.est.slice().sort((a,b)=>a.o-b.o).map(d=>d.d))],rowH=34,h=dets.length*rowH+8;
  const s=d3.select(el).attr('viewBox',`0 0 ${w} ${h}`).attr('height',h);s.selectAll('*').remove();
  const lw=Math.min(w*0.46,w<500?150:250),x0=lw,x1=w-46,tipEl=ensureTip(el);
  dets.forEach((det,i)=>{
    const ds=D.est.filter(d=>d.d===det),ext=d3.max(ds,d=>Math.max(Math.abs(d.lo),Math.abs(d.hi)))*1.08||1,x=d3.scaleLinear([-ext,ext],[x0,x1]),yc=4+i*rowH+rowH/2;
    if(i%2===0)s.append('rect').attr('x',0).attr('y',yc-rowH/2).attr('width',w).attr('height',rowH).attr('fill','var(--tint)').attr('opacity',.5);
    s.append('text').attr('x',4).attr('y',yc+4).style('fill','var(--heading)').style('font-size','12px').text(det);
    s.append('line').attr('class','ref').attr('x1',x(0)).attr('x2',x(0)).attr('y1',yc-rowH/2+4).attr('y2',yc+rowH/2-4);
    s.append('text').attr('x',x1+5).attr('y',yc+4).text('±'+dec(ext,ext<1?2:1));
    MOD.forEach((m,j)=>{const d=ds.find(q=>q.m===m);if(!d)return;const yy=yc+(j-1)*8,sig=d.lo>0||d.hi<0;
      s.append('line').attr('x1',x(d.lo)).attr('x2',x(d.hi)).attr('y1',yy).attr('y2',yy).attr('stroke',MC[m]).attr('stroke-width',2).attr('stroke-linecap','round').attr('opacity',j?0.7:1);
      s.append('circle').attr('cx',x(d.b)).attr('cy',yy).attr('r',j?3:4).attr('fill',sig?MC[m]:'var(--card)').attr('stroke',MC[m]).attr('stroke-width',1.6).style('cursor','default')
        .on('pointermove',e=>showMini(e,el,tipEl,`<b>${det}</b><div style="color:var(--muted)">${m}</div><div class="t-row"><span>Coefficient</span><span>${fsg(d.b,3)}</span></div><div class="t-row"><span>Std. error</span><span>${dec(d.se,3)}</span></div><div class="t-row"><span>p-value</span><span>${dec(d.p,3)}</span></div>${d.w!=null?`<div class="t-row"><span>Bootstrap p</span><span>${dec(d.w,3)}</span></div>`:''}`)).on('pointerleave',()=>tipEl.style.display='none');});
  });
}
function renderPolicy(){
  const vc=v=>/Strong|^Positive$/.test(v)?'v-pos':/Negative/.test(v)?'v-neg':/Weak|imprecise|Suggestive/.test(v)?'v-weak':'v-none';
  const st=s=>s==='p<0.01'?'***':s==='p<0.05'?'**':s==='p<0.1'?'*':'';
  $('#ptbl tbody').innerHTML=D.pol.slice().sort((a,b)=>a.o-b.o).map(r=>{const e=(Math.exp(r.b)-1)*100;return `<tr><td class="l wrapc">${esc(r.pol)}</td><td class="l">${esc(r.out)}</td><td>${fsg(r.b,3)}${st(r.sig)}</td><td>${Math.abs(e)>=300?'×'+f0(Math.exp(r.b)):fsg(e,0)+'%'}</td><td>${r.w==null?'–':dec(r.w,3)}</td><td class="l"><span class="verdict ${vc(r.v)}">${esc(r.v)}</span></td></tr>`;}).join('');
}
function renderEvent(){
  const el=$('#event'),w=el.clientWidth||420,h=220,m={l:36,r:10,t:10,b:36},d=D.ev.slice().sort((a,b)=>a.k-b.k);
  const x=d3.scaleLinear([-5,5],[m.l,w-m.r]),y=d3.scaleLinear([d3.min(d,v=>v.lo),d3.max(d,v=>v.hi)],[h-m.b,m.t]).nice();
  const s=d3.select(el).attr('viewBox',`0 0 ${w} ${h}`).attr('height',h);s.selectAll('*').remove();
  y.ticks(5).forEach(t=>{s.append('line').attr('class','grid').attr('x1',m.l).attr('x2',w-m.r).attr('y1',y(t)).attr('y2',y(t));s.append('text').attr('x',m.l-5).attr('y',y(t)+4).attr('text-anchor','end').text(dec(t,1));});
  d.forEach(v=>s.append('text').attr('x',x(v.k)).attr('y',h-m.b+14).attr('text-anchor','middle').text(v.k===-5?'≤−5':v.k===5?'≥5':String(v.k).replace('-','−')));
  s.append('text').attr('x',(m.l+w-m.r)/2).attr('y',h-4).attr('text-anchor','middle').text('Years relative to the first SEZ starting operation');
  s.append('path').attr('d',d3.area().x(v=>x(v.k)).y0(v=>y(v.lo)).y1(v=>y(v.hi))(d)).attr('fill','var(--c1)').attr('fill-opacity',.15);
  s.append('line').attr('class','ref').attr('x1',m.l).attr('x2',w-m.r).attr('y1',y(0)).attr('y2',y(0)).style('stroke-dasharray','none');
  s.append('line').attr('class','ref').attr('x1',x(-.5)).attr('x2',x(-.5)).attr('y1',m.t).attr('y2',h-m.b);
  s.append('path').attr('d',d3.line().x(v=>x(v.k)).y(v=>y(v.b))(d)).attr('fill','none').attr('stroke','var(--c1)').attr('stroke-width',2);
  const tipEl=ensureTip(el);
  s.append('g').selectAll('circle').data(d).join('circle').attr('cx',v=>x(v.k)).attr('cy',v=>y(v.b)).attr('r',3.5).attr('fill','var(--c1)')
    .on('pointermove',(e,v)=>showMini(e,el,tipEl,`<b>Year ${String(v.k).replace('-','−')}</b><div class="t-row"><span>Effect</span><span>${fsg(v.b,2)}</span></div><div class="t-row"><span>95% interval</span><span>${dec(v.lo,2)} to ${dec(v.hi,2)}</span></div>`)).on('pointerleave',()=>tipEl.style.display='none');
}

/* ---------- table ---------- */
const COLS=[
 {k:'n',l:'Province',t:'s',v:p=>p.n,c:'l'},
 {k:'c',l:'Corridor',t:'s',v:p=>p.c,c:'l'},
 {k:'fdi',l:'FDI (US$ m)',v:p=>p.p[S.per].fdi,f:f0},
 {k:'sh',l:'Share %',v:p=>p.p[S.per].sh,f:x=>dec(x,2)},
 {k:'met',l:'Basic metals %',v:p=>p.p[S.per].fdi?p.p[S.per].met/p.p[S.per].fdi*100:0,f:x=>dec(x,0)},
 {k:'idx',l:'Index',v:p=>p.p[S.per].idx,f:x=>dec(x,2)},
 {k:'rk',l:'Rank',v:p=>p.p[S.per].rk,f:x=>x},
 {k:'perf',l:'Performance',v:p=>p.p[S.per].perf,f:x=>dec(x,2)},
 {k:'q',l:'Group',t:'s',v:p=>p.q,c:'l'},
 {k:'gr',l:'Growth 2024 %',v:p=>p.l.gr,f:x=>dec(x,1)},
 {k:'nx',l:'Net exports 2024 %',v:p=>p.l.nx,f:x=>dec(x,1)},
 {k:'il',l:'Illiteracy 2024 %',v:p=>p.l.il,f:x=>dec(x,1)}
];
function renderTable(){
  const [sk,sd]=S.sort,col=COLS.find(c=>c.k===sk);
  $('#tbl thead').innerHTML='<tr>'+COLS.map(c=>`<th class="${c.c||''}" ${c.k===sk?`aria-sort="${sd>0?'ascending':'descending'}"`:''}><button data-k="${c.k}">${c.l}${c.k===sk?(sd>0?' ▲':' ▼'):''}</button></th>`).join('')+'</tr>';
  let rs=prov.filter(p=>!S.q||(p.n+' '+p.c+' '+p.q).toLowerCase().includes(S.q));
  rs.sort((a,b)=>{const va=col.v(a),vb=col.v(b);return (col.t==='s'?String(va).localeCompare(String(vb),'en'):va-vb)*sd;});
  $('#tbl tbody').innerHTML=rs.map(p=>`<tr class="${p.pid===S.sel?'on':''}">`+COLS.map(c=>c.k==='n'?`<td class="l"><i class="wd" style="background:${CC[p.c]}"></i><button class="nm" data-pid="${p.pid}">${esc(p.n)}</button></td>`:`<td class="${c.c||''}">${c.f?c.f(c.v(p)):esc(c.v(p))}</td>`).join('')+'</tr>').join('');
  $('#tblTitle').textContent='Data by province, '+PERL[S.per];
  $('#tblCount').textContent=`${rs.length} of 33 provinces. Index and rank for ${IDXL[S.per]}; economic indicators for 2024. Click a column heading to sort.`;
  document.querySelectorAll('#tbl thead button').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;S.sort=S.sort[0]===k?[k,-S.sort[1]]:[k,COLS.find(c=>c.k===k).t==='s'||k==='rk'?1:-1];renderTable();}));
  document.querySelectorAll('#tbl .nm').forEach(b=>b.addEventListener('click',()=>{select(+b.dataset.pid);document.getElementById('mapbox').scrollIntoView({behavior:still()?'auto':'smooth',block:'center'});}));
}

/* ---------- state ---------- */
function headings(){
  const m=mode(),p=S.prov?byId.get(S.prov):null;
  $('#mapTitle').textContent=m.l+(m.k==='quad'||m.k==='road'?'':', '+PERL[S.per]);
  $('#mapSub').textContent=p?`Focused on ${p.n}. Other provinces are dimmed.`:'33 provinces at 2010 boundaries.';
  $('#scopeLabel').textContent=p?'Area: '+p.n:'Area: Indonesia';
  $('#btnClear').hidden=!p;
}
function select(pid){S.sel=S.sel===pid?null:pid;paintMap();renderDetail();renderScatter();renderLists();renderTable();}
function renderAll(){headings();legend();paintMap();renderKPI();renderHL();renderTrend();renderScatter();renderDetail();renderLists();renderTable();}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.per=b.dataset.per;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));renderAll();}));
const sp=$('#selProv');sp.innerHTML='<option value="0">Indonesia (33 provinces)</option>'+prov.slice().sort((a,b)=>a.n.localeCompare(b.n,'en')).map(p=>`<option value="${p.pid}">${esc(p.n)}</option>`).join('');
sp.addEventListener('change',()=>{S.prov=+sp.value;S.sel=S.prov||null;zoomToScope();renderAll();});
const sm=$('#selMode');sm.innerHTML=MODES.map(m=>`<option value="${m.k}">${m.l}</option>`).join('');
sm.addEventListener('change',()=>{S.mode=sm.value;renderAll();});
$('#btnClear').addEventListener('click',()=>{S.prov=0;S.sel=null;sp.value='0';zoomToScope();renderAll();});
$('#zin').addEventListener('click',()=>svg.transition().duration(still()?0:250).call(zoom.scaleBy,1.6));
$('#zout').addEventListener('click',()=>svg.transition().duration(still()?0:250).call(zoom.scaleBy,1/1.6));
$('#zreset').addEventListener('click',()=>zoomToScope());
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim().toLowerCase();renderTable();});
let rt;window.addEventListener('resize',()=>{if(window.__LANG!==LANG)return;clearTimeout(rt);rt=setTimeout(()=>{buildMap();renderAll();renderCoef();renderEvent();},150);});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(window.__LANG!==LANG)return;renderAll();});
const st=window.__ST||{};if(st.per&&PER.includes(st.per))S.per=st.per;if(st.mode&&MODES.some(m=>m.k===st.mode))S.mode=st.mode;if(st.prov)S.prov=st.prov;if(st.sel)S.sel=st.sel;
document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.per===S.per)));sp.value=String(S.prov||0);sm.value=S.mode;
window.__getST=()=>({per:S.per,mode:S.mode,prov:S.prov,sel:S.sel});
buildMap();renderAll();renderCoef();renderPolicy();renderEvent();
}


(function(){
  const app=document.getElementById('app'),TT={"id": "Dasbor Distribusi Investasi Asing Menurut Provinsi di Indonesia", "en": "Dashboard of Foreign Investment Distribution by Province in Indonesia"},DD={"id": "Dasbor interaktif realisasi penanaman modal asing (PMA) di 33 provinsi Indonesia, 2010–2024: sebaran, indeks daya tarik, dan dampak kebijakan. Triarka Institute.", "en": "Interactive dashboard of realised foreign direct investment across Indonesia’s 33 provinces, 2010–2024. Triarka Institute."};
  const get=()=>{try{const h=(location.hash||'').replace('#','');if(h==='en'||h==='id')return h;const q=new URLSearchParams(location.search).get('lang');if(q==='en'||q==='id')return q;const s=localStorage.getItem('triarka-fdi-lang');if(s==='en'||s==='id')return s;}catch(e){}return 'id';};
  function show(L){
    if(window.__getST)window.__ST=window.__getST();
    window.__LANG=L;app.replaceChildren(document.getElementById('tpl-'+L).content.cloneNode(true));
    document.documentElement.lang=L;document.title=TT[L];
    const md=document.querySelector('meta[name="description"]');if(md)md.setAttribute('content',DD[L]);
    app.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===L)));
    (L==='en'?APP_en:APP_id)();
    try{localStorage.setItem('triarka-fdi-lang',L);}catch(e){}
    try{history.replaceState(null,'',L==='en'?'#en':'#id');}catch(e){}
  }
  app.addEventListener('click',e=>{const b=e.target.closest('.lang button');if(b&&b.dataset.lang!==window.__LANG){show(b.dataset.lang);const t=app.querySelector('.lang button[aria-pressed="true"]');if(t)t.focus();}});
  window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if((h==='en'||h==='id')&&h!==window.__LANG)show(h);});
  show(get());
})();

</script>
